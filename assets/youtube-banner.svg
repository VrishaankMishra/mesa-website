<svg width="2560" height="1440" viewBox="0 0 2560 1440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MeSA Robotics channel banner">
  <!-- Full canvas. YouTube crops heavily across devices; ALL important content is kept
       inside the centered safe area 1546x423 (x:507-2053, y:508-931). -->
  <rect width="2560" height="1440" fill="#FBFAF8"/>

  <!-- centered content lockup, anchored at canvas center (1280,720) -->
  <g transform="translate(1280,720)">
    <!-- mark -->
    <g transform="translate(-470,-150)">
      <circle cx="40" cy="40" r="38" fill="none" stroke="#14110F" stroke-width="5"/>
      <g transform="rotate(-35 40 40)">
        <rect x="24" y="26" width="32" height="27" rx="13.5" fill="#14110F"/>
        <line x1="40" y1="26" x2="40" y2="53" stroke="#FBFAF8" stroke-width="3.5"/>
      </g>
    </g>
    <!-- wordmark -->
    <text x="-360" y="-92" font-family="Fraunces, Georgia, serif" font-size="116" font-weight="600" fill="#14110F">MeSA</text>
    <text x="-22" y="-92" font-family="Inter, Arial, sans-serif" font-size="64" fill="#6B6660">2.0</text>

    <!-- tagline -->
    <text x="-470" y="-6" font-family="Fraunces, Georgia, serif" font-size="56" font-weight="400" fill="#14110F">Right medication. On time. Safe at home.</text>

    <!-- subline -->
    <text x="-470" y="62" font-family="Inter, Arial, sans-serif" font-size="30" letter-spacing="1" fill="#6B6660">An assistive home-care robot · built on a Raspberry Pi</text>

    <!-- handle / links -->
    <text x="-470" y="150" font-family="Inter, Arial, sans-serif" font-size="26" fill="#1C6B47">github.com/VrishaankMishra/mesa-ai-robot</text>
  </g>
</svg>
