<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MeSA 2.0 — Right medication. On time. Safe at home.">
  <!-- paper background -->
  <rect width="1200" height="630" fill="#FBFAF8"/>
  <!-- inset hairline frame -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#E5E1DB" stroke-width="2"/>

  <!-- brand lockup: mark + wordmark -->
  <g transform="translate(96,108)">
    <circle cx="22" cy="22" r="21" fill="none" stroke="#14110F" stroke-width="3"/>
    <g transform="rotate(-35 22 22)">
      <rect x="13" y="14.5" width="18" height="15" rx="7.5" fill="#14110F"/>
      <line x1="22" y1="14.5" x2="22" y2="29.5" stroke="#FBFAF8" stroke-width="2"/>
    </g>
    <text x="58" y="34" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="34" font-weight="600" fill="#14110F">MeSA</text>
    <text x="158" y="34" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#6B6660">2.0</text>
  </g>

  <!-- eyebrow -->
  <text x="96" y="240" font-family="Inter, Arial, sans-serif" font-size="22" letter-spacing="3" fill="#6B6660">MEDICATION &amp; SAFETY ASSISTANT ROBOT</text>

  <!-- headline -->
  <text x="94" y="340" font-family="Fraunces, Georgia, serif" font-size="80" font-weight="500" fill="#14110F">Right medication.</text>
  <text x="94" y="430" font-family="Fraunces, Georgia, serif" font-size="80" font-weight="500" fill="#14110F">On time. Safe at home.</text>

  <!-- lede -->
  <text x="96" y="498" font-family="Inter, Arial, sans-serif" font-size="27" fill="#2b2724">Recognizes medications · tracks doses · detects falls · alerts a caregiver — offline.</text>

  <!-- footer row -->
  <text x="96" y="566" font-family="Inter, Arial, sans-serif" font-size="20" fill="#6B6660">github.com/VrishaankMishra/mesa-ai-robot</text>
  <text x="1104" y="566" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="18" font-style="italic" fill="#6B6660">An assistive aid, not a medical device.</text>
</svg>
